<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de negocios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/app/lucide.min.js"></script>
<script src="/static/app/brands.js"></script>
<script src="/static/app/analitica.js"></script>
<style>
:root {
  --bg: #f5f7f9; --surface: #ffffff; --surface-2: #f0f3f6; --line: #e1e6eb; --line-strong: #cdd5dd;
  --text: #16202a; --text-2: #4d5b69; --text-3: #7b8896;
  --accent: #0891a6; --accent-strong: #06798b; --accent-soft: #e3f4f7; --on-accent: #ffffff;
  --ok: #1e7d4f; --ok-soft: #e4f3ea; --warn: #9a6400; --warn-soft: #fbf1dd; --err: #b3261e; --err-soft: #fbe7e5;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --r: 8px; --r-sm: 4px;
}
:root[data-theme="dark"] {
  --bg: #0f1419; --surface: #161d24; --surface-2: #1c252e; --line: #26313c; --line-strong: #34414e;
  --text: #e6ebf0; --text-2: #a6b3bf; --text-3: #75838f;
  --accent: #2bb3c6; --accent-strong: #52c6d6; --accent-soft: #11313a; --on-accent: #06222a;
  --ok: #5cc48f; --ok-soft: #10301f; --warn: #e0a84a; --warn-soft: #33260d; --err: #f08a82; --err-soft: #3a1714;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, -apple-system, Segoe UI, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex: none; }
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- barra superior ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1440px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 34px; height: 34px; border-radius: var(--r); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark svg.lucide { width: 18px; height: 18px; }
.brand h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.brand p { margin: 0; font-size: 12px; color: var(--text-3); }
.topbar .spacer { flex: 1; }

/* ---------- controles ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none !important; }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .field:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-danger { color: var(--err); }
.btn-danger:hover { background: var(--err-soft); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn-icon { width: 36px; padding: 0; }
.btn-block { width: 100%; height: 42px; font-size: 15px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

.field { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 8px 11px; outline: none; }
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.field { resize: vertical; min-height: 84px; }
select.field { height: 36px; padding: 0 10px; }
.lbl { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.hint { font-size: 12px; color: var(--text-3); margin-top: 5px; }

/* ---------- estructura ---------- */
.wrap { max-width: 1440px; margin: 0 auto; padding: 24px; }
.home { display: grid; grid-template-columns: 400px 1fr; gap: 24px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.card-h h2 { font-size: 15px; margin: 0; font-weight: 600; }
.card-h .muted { color: var(--text-3); font-size: 13px; }
.card-b { padding: 20px; }
.stack > * + * { margin-top: 18px; }

/* ---------- formulario ---------- */
.preview { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 10px 12px; background: var(--surface-2); }
.preview-t { font-size: 12px; color: var(--text-2); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
.preview ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.preview li { font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px 8px; }
.options { display: grid; gap: 8px; }
.option { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line-strong); border-radius: var(--r); padding: 10px 12px; cursor: pointer; }
.option:hover { background: var(--surface-2); }
.option input { margin-top: 3px; accent-color: var(--accent); }
.option.sel { border-color: var(--accent); background: var(--accent-soft); }
.option b { display: block; font-size: 13px; }
.option span { font-size: 12px; color: var(--text-2); }
.switch-row { display: flex; gap: 12px; align-items: flex-start; }
.switch { position: relative; width: 38px; height: 22px; flex: none; margin-top: 1px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i { position: absolute; inset: 0; background: var(--line-strong); border-radius: var(--r-sm); transition: .15s; cursor: pointer; }
.switch i::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 2px; transition: .15s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::before { transform: translateX(16px); }
details.adv summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-2); list-style: none; display: flex; align-items: center; gap: 6px; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv[open] summary .chev { transform: rotate(90deg); }
details.adv .inner { margin-top: 14px; }

/* ---------- lista de búsquedas ---------- */
.jobs { display: grid; gap: 10px; }
.job { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; background: var(--surface); }
.job:hover { border-color: var(--line-strong); }
.job-t { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.job-k { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.job-m { font-size: 12px; color: var(--text-3); display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
.job-m span { display: inline-flex; align-items: center; gap: 5px; }
.job-m svg.lucide { width: 13px; height: 13px; }
.job-a { display: flex; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-sm); border: 1px solid transparent; }
.tag svg.lucide { width: 13px; height: 13px; }
.tag-ok { background: var(--ok-soft); color: var(--ok); }
.tag-run { background: var(--accent-soft); color: var(--accent-strong); }
.tag-wait { background: var(--surface-2); color: var(--text-2); border-color: var(--line); }
.tag-warn { background: var(--warn-soft); color: var(--warn); }
.tag-err { background: var(--err-soft); color: var(--err); }
.progress { grid-column: 1 / -1; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .5s; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 48px 20px; color: var(--text-2); }
.empty .ico { width: 44px; height: 44px; border-radius: var(--r); background: var(--surface-2); display: grid; place-items: center; margin: 0 auto 12px; color: var(--text-3); }
.empty h3 { margin: 0 0 4px; font-size: 15px; color: var(--text); }
.empty p { margin: 0; font-size: 13px; }

/* ---------- resultados ---------- */
.res-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 18px; flex-wrap: wrap; }
.res-head h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.res-head .sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.res-head .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi .l { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .v { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .p { font-size: 12px; color: var(--text-3); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1 1 240px; }
.search svg.lucide { position: absolute; left: 10px; top: 10px; color: var(--text-3); }
.search .field { padding-left: 32px; height: 36px; }
.toolbar select.field { width: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.chips .t { font-size: 12px; color: var(--text-3); margin-right: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; cursor: pointer; }
.chip:hover { background: var(--surface-2); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
.chip svg.lucide { width: 14px; height: 14px; }
.tabs { display: flex; gap: 2px; margin-left: auto; background: var(--surface-2); border-radius: var(--r); padding: 3px; }
.tab { height: 30px; padding: 0 12px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--text-2); font-weight: 500; }
.tab.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.count { padding: 10px 16px; font-size: 12px; color: var(--text-3); border-bottom: 1px solid var(--line); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.sel td { background: var(--accent-soft); }
.biz { display: flex; gap: 12px; align-items: flex-start; min-width: 240px; }
.thumb { width: 44px; height: 44px; border-radius: var(--r-sm); object-fit: cover; background: var(--surface-2); flex: none; display: grid; place-items: center; color: var(--text-3); }
.biz b { display: block; font-size: 13px; }
.biz .c { color: var(--text-2); font-size: 12px; }
.contact { display: grid; gap: 4px; min-width: 190px; }
.contact div { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.contact a[href^="tel:"] { white-space: nowrap; }
.contact svg.lucide { width: 14px; height: 14px; color: var(--text-3); }
.none { color: var(--text-3); }
.wa { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: var(--r-sm); background: var(--ok-soft); color: var(--ok) !important; }
.wa svg.lucide { width: 12px; height: 12px; color: var(--ok) !important; }
.stars { display: inline-flex; gap: 4px; align-items: center; font-weight: 600; white-space: nowrap; }
.stars svg.lucide { width: 14px; height: 14px; color: #d99a06; fill: #d99a06; }
.stars small { color: var(--text-3); font-weight: 400; }
.ver { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--accent-strong); font-weight: 600; }
.ver svg.lucide { width: 12px; height: 12px; }
.ads { display: flex; flex-wrap: wrap; gap: 4px; min-width: 150px; }
.ad { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); color: var(--text-2); background: var(--surface); white-space: nowrap; }
.ad svg.lucide { width: 12px; height: 12px; }
.ad-meta { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
.nets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.net { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); color: var(--text-2) !important; background: var(--surface); text-decoration: none !important; white-space: nowrap; }
.net:hover { border-color: var(--accent); color: var(--accent-strong) !important; }
.net small { font-weight: 500; color: var(--text-3); }
.ad-ia { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ad-wa { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.soc { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.soc + .soc { margin-top: 8px; }
.soc-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.soc-h b { font-size: 13px; }
.soc-n { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; }
.soc-n div { font-size: 12px; color: var(--text-2); }
.soc-n strong { display: block; font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
.soc p { margin: 6px 0 0; font-size: 12px; color: var(--text-2); }
.plat { display: block; font-size: 11px; color: var(--text-3); margin-top: 2px; }
.scan { display: inline-flex; align-items: center; gap: 8px; margin-left: 10px; }
.scan .bar { width: 120px; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.scan .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
.opp { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); }
.logo-marca { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: -2px; object-fit: contain; border-radius: 3px; }
.net .logo-marca, .ad .logo-marca, .wa .logo-marca { width: 13px; height: 13px; }
.btn-primary .logo-marca { width: 18px; height: 18px; padding: 2px; background: #fff; border-radius: 4px; box-sizing: border-box; }
.dl > .logo-marca { width: 16px; height: 16px; margin-top: 2px; }
.soc-h b { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.soc-h a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.soc-h b .logo-marca { width: 16px; height: 16px; }
[data-theme="dark"] img.logo-marca { background: #fff; padding: 1px; box-sizing: border-box; }
.plat .logo-marca { width: 12px; height: 12px; margin-right: 4px; vertical-align: -2px; }
#map { height: 620px; }

/* ---------- selector de zonas (catálogo oficial) ---------- */
.zona-row { display: flex; gap: 8px; position: relative; }
.ac { flex: 1; }
.ac-list { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: 0 8px 24px rgba(16,24,40,.12); max-height: 340px; overflow-y: auto; }
.ac-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 7px 9px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; }
.ac-list li.on, .ac-list li[data-i]:hover { background: var(--accent-soft); }
.ac-list li.none { cursor: default; }
.ac-t { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent-strong); background: var(--accent-soft); border-radius: var(--r-sm); padding: 1px 5px; }
.ac-c { flex-basis: 100%; font-size: 12px; color: var(--text-3); }
.zonas-sel { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.zonas-sel:empty { display: none; }
.zona-chip { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 6px 6px 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface-2); font-size: 13px; position: relative; padding-right: 42px; }
.zona-chip .btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); height: 28px; width: 28px; }
.zv { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--text-3); }
.zv.ok { color: var(--ok); }
.zv svg.lucide { width: 12px; height: 12px; }

/* ---------- analítica ---------- */
.an { padding: 16px; display: grid; gap: 16px; }
.an-aviso { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r); background: var(--accent-soft); color: var(--text-2); font-size: 13px; }
.an-filtros { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.an-fh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.an-fh b { margin-right: 4px; }
.cond { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cond select.field, .an-fh select.field { height: 34px; max-width: 320px; }
.an-kpis { margin: 0; }
.an-grafs { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.an-graf { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.an-graf h4 { margin: 0; font-size: 14px; }
.an-sub { font-size: 12px; color: var(--text-3); margin: 2px 0 10px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 42%) 1fr 64px; align-items: center; gap: 10px; padding: 3px 0; cursor: default; }
.bar-row:hover .bar-t { background: var(--line); }
.bar-l { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); min-width: 0; }
.bar-l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-t { height: 14px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.bar-t i { display: block; height: 100%; min-width: 2px; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar-t i.st-activo { background: var(--ok); } .bar-t i.st-poco { background: var(--warn); } .bar-t i.st-inactivo { background: var(--err); } .bar-t i.st-sin { background: var(--line-strong); }
.bar-v { font-size: 12px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.bar-v small { display: block; font-weight: 400; color: var(--text-3); }
.st-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; flex: none; }
.st-dot.st-activo { background: var(--ok); } .st-dot.st-poco { background: var(--warn); } .st-dot.st-inactivo { background: var(--err); } .st-dot.st-sin { background: var(--line-strong); }
.an-tip { position: fixed; z-index: 60; display: none; pointer-events: none; background: var(--text); color: var(--surface); font-size: 12px; padding: 6px 8px; border-radius: var(--r-sm); max-width: 320px; box-shadow: var(--shadow); }
.an-tabla-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.an-tabla th { cursor: pointer; user-select: none; white-space: nowrap; }
.an-tabla th.on { color: var(--accent-strong); }
.an-tabla td .c { font-size: 12px; color: var(--text-3); }
.an-ics { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.an-tabla tbody tr { cursor: pointer; }
.meter { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--surface-2); vertical-align: 1px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.pres { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
.pres-v { font-size: 34px; font-weight: 700; line-height: 1; }
.pres-v small { font-size: 14px; color: var(--text-3); font-weight: 500; }
.pres-pos { display: flex; flex-wrap: wrap; gap: 6px; }
.pos { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent-strong); }

<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand-mark"><i data-lucide="map-pinned"></i></div>
    <div class="brand">
      <h1>Buscador de negocios</h1>
      <p>Clientes potenciales desde Google Maps: teléfono, email, web y valoraciones</p>
    </div>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="/api/docs" target="_blank" rel="noopener" title="Documentación técnica de la API">
      <i data-lucide="code-xml"></i><span>API</span>
    </a>
    <button class="btn btn-icon btn-ghost" id="themeBtn" title="Cambiar modo claro / oscuro"><i data-lucide="moon"></i></button>
  </div>
</header>

<main class="wrap" id="view"></main>

<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="drawer-bg" id="drawerBg"></div>

<div class="modal-bg" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mb">
      <div class="mi"><i data-lucide="trash-2"></i></div>
      <div><h3 id="modalT"></h3><p id="modalP"></p></div>
    </div>
    <div class="mf">
      <button class="btn" id="modalNo">Cancelar</button>
      <button class="btn btn-primary" id="modalYes" style="background:var(--err);border-color:var(--err);color:#fff">Eliminar</button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";

/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icons = () => window.lucide && lucide.createIcons();
// Minúsculas y sin tildes: «chamberi» encuentra «Chamberí» y «logrono», «Logroño».
const plano = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmtN = (n) => new Intl.NumberFormat("es").format(n);
const fmtDate = (d) => new Intl.DateTimeFormat("es", { dateStyle: "medium", timeStyle: "short" }).format(new Date(d));
const fmtK = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " M" : n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(".", ",") + " mil" : fmtN(n));
const REDES = { facebook: ["FB", "Facebook"], instagram: ["IG", "Instagram"], tiktok: ["TT", "TikTok"], youtube: ["YT", "YouTube"], linkedin: ["IN", "LinkedIn"], x: ["X", "X (Twitter)"], whatsapp: ["WA", "WhatsApp"] };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0) + " %";

function toast(msg, err = false) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.innerHTML = `<i data-lucide="${err ? "circle-alert" : "check"}"></i><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(t);
  icons();
  setTimeout(() => t.remove(), 3500);
}

function confirmar(titulo, texto) {
  return new Promise((ok) => {
    $("#modalT").textContent = titulo;
    $("#modalP").textContent = texto;
    $("#modal").classList.add("open");
    const fin = (v) => { $("#modal").classList.remove("open"); $("#modalYes").onclick = $("#modalNo").onclick = null; ok(v); };
    $("#modalYes").onclick = () => fin(true);
    $("#modalNo").onclick = () => fin(false);
  });
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let m = r.statusText;
    try { m = (await r.json()).message || m; } catch (e) {}
    throw new Error(m);
  }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

/* tema claro / oscuro */
function aplicarTema(t) {
  document.documentElement.dataset.theme = t;
  $("#themeBtn").innerHTML = `<i data-lucide="${t === "dark" ? "sun" : "moon"}"></i>`;
  icons();
}
(() => {
  let t = null;
  try { t = localStorage.getItem("tema"); } catch (e) {}
  aplicarTema(t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  $("#themeBtn").onclick = () => {
    const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("tema", n); } catch (e) {}
    aplicarTema(n);
  };
})();

/* ================= teléfonos ================= */
// Móvil = puede tener WhatsApp. Reglas por país para los mercados con los que trabajamos.
function digitos(p) { return (p || "").replace(/[^\d+]/g, ""); }
function esMovil(p) {
  const d = digitos(p);
  if (/^\+573\d{9}$/.test(d)) return true;           // Colombia
  if (/^\+34[67]\d{8}$/.test(d)) return true;         // España
  if (/^\+521?\d{10}$/.test(d)) return true;          // México (todas las líneas usan WhatsApp)
  if (/^\+519\d{8}$/.test(d)) return true;            // Perú
  if (/^\+569\d{8}$/.test(d)) return true;            // Chile
  if (/^\+549\d{10}$/.test(d)) return true;           // Argentina
  if (/^\+593 ?9\d{8}$/.test(d)) return true;         // Ecuador
  return false;
}
const waLink = (p) => "https://wa.me/" + digitos(p).replace("+", "");
const dominio = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };

/* ================= estado ================= */
const S = {
  jobs: [], leadsCache: {}, poll: null,
  res: null, // { job, leads, f: filtros, tab, map }
};

const COBERTURA = {
  1: { t: "Rápida", d: "Los primeros resultados de cada búsqueda (unos 20). Ideal para probar.", min: 10 },
  5: { t: "Normal", d: "Hasta unos 60 negocios por búsqueda.", min: 20 },
  10: { t: "A fondo", d: "Todo lo que muestre Google Maps (hasta unos 120 por búsqueda). Tarda más.", min: 40 },
};

const ESTADO = {
  pending: { c: "tag-wait", i: "clock", t: "En cola" },
  working: { c: "tag-run", i: "loader-circle", t: "Buscando…" },
  ok: { c: "tag-ok", i: "circle-check", t: "Terminada" },
  empty: { c: "tag-warn", i: "circle-alert", t: "Sin resultados" },
  failed: { c: "tag-err", i: "circle-x", t: "Error" },
};

/* ================= enrutado ================= */
window.addEventListener("hashchange", enrutar);
function enrutar() {
  const m = location.hash.match(/^#\/busqueda\/([\w-]+)/);
  cerrarDetalle();
  if (m) verResultados(m[1]); else pintarInicio();
}

/* ================= inicio ================= */
function pintarInicio() {
  S.res = null;
  $("#view").innerHTML = `
  <div class="home">
    <section class="card">
      <div class="card-h"><i data-lucide="search"></i><h2>Nueva búsqueda</h2></div>
      <form class="card-b stack" id="form" autocomplete="off">
        <div>
          <label class="lbl" for="tipos">¿Qué negocios buscas?</label>
          <textarea class="field" id="tipos" rows="3" placeholder="restaurantes&#10;peluquerías&#10;clínicas dentales" required></textarea>
          <div class="hint">Un tipo de negocio por línea, tal como lo escribirías en Google Maps.</div>
        </div>
        <div>
          <label class="lbl" for="zonaQ">¿Dónde?</label>
          <div class="zona-row">
            <select class="field" id="pais" title="País" style="width:150px"></select>
            <div class="ac">
              <input class="field" id="zonaQ" placeholder="Barrio, municipio, código postal, provincia…" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="zonaL">
              <ul class="ac-list" id="zonaL" role="listbox" hidden></ul>
            </div>
          </div>
          <div class="zonas-sel" id="zonasSel"></div>
          <div class="hint" id="zonaHint">Solo se pueden elegir lugares reales del catálogo oficial. Puedes añadir varias zonas.</div>
        </div>
        <div class="preview" id="preview" hidden>
          <div class="preview-t"><i data-lucide="list-checks"></i><span id="previewT"></span></div>
          <ul id="previewL"></ul>
        </div>
        <div>
          <span class="lbl">Cobertura</span>
          <div class="options" id="cobertura">
            ${Object.entries(COBERTURA).map(([v, o]) => `
              <label class="option ${v === "5" ? "sel" : ""}">
                <input type="radio" name="depth" value="${v}" ${v === "5" ? "checked" : ""}>
                <div><b>${o.t}</b><span>${o.d}</span></div>
              </label>`).join("")}
          </div>
        </div>
        <div class="switch-row">
          <label class="switch"><input type="checkbox" id="email" checked><i></i></label>
          <div><label class="lbl" for="email" style="margin:0">Buscar emails</label>
          <div class="hint" style="margin-top:2px">Entra en la web de cada negocio para sacar su email. Tarda más, pero es el dato más valioso.</div></div>
        </div>
        <div>
          <label class="lbl" for="maxt">Tiempo máximo</label>
          <select class="field" id="maxt">
            ${[10, 20, 40, 60, 120].map((m) => `<option value="${m}" ${m === 20 ? "selected" : ""}>${m < 60 ? m + " minutos" : m / 60 + (m === 60 ? " hora" : " horas")}</option>`).join("")}
          </select>
          <div class="hint">Si se alcanza, la búsqueda se detiene y guarda lo encontrado hasta ese momento.</div>
        </div>
        <div>
          <label class="lbl" for="nombre">Nombre de la búsqueda <span style="font-weight:400;color:var(--text-3)">(opcional)</span></label>
          <input class="field" id="nombre" placeholder="Se genera solo si lo dejas vacío">
        </div>
        <details class="adv">
          <summary><i data-lucide="chevron-right" class="chev"></i>Opciones avanzadas</summary>
          <div class="inner stack">
            <div>
              <label class="lbl" for="lang">Idioma de los resultados</label>
              <select class="field" id="lang">
                <option value="es" selected>Español</option><option value="en">Inglés</option><option value="pt">Portugués</option><option value="fr">Francés</option>
              </select>
            </div>
            <div>
              <label class="lbl" for="proxies">Proxies</label>
              <textarea class="field" id="proxies" rows="2" placeholder="http://usuario:clave@servidor:puerto"></textarea>
              <div class="hint">Solo si Google empieza a bloquear. Uno por línea. Déjalo vacío normalmente.</div>
            </div>
          </div>
        </details>
        <button class="btn btn-primary btn-block" type="submit" id="go"><i data-lucide="play"></i>Empezar búsqueda</button>
      </form>
    </section>

    <section class="card">
      <div class="card-h"><i data-lucide="history"></i><h2>Mis búsquedas</h2><span class="muted" id="jobsN"></span></div>
      <div class="card-b"><div class="jobs" id="jobs"><div class="empty"><p>Cargando…</p></div></div></div>
    </section>
  </div>`;
  icons();
  enlazarFormulario();
  cargarJobs();
}

// Una consulta por tipo de negocio y zona, centrada en las coordenadas oficiales
// de la zona («texto #@lat,lon,zoom»); la vista previa enseña solo el texto.
function consultas() {
  const tipos = $("#tipos").value.split("\n").map((s) => s.trim()).filter(Boolean);
  const zonas = S.zonas || [];
  const out = [], lineas = [];
  for (const t of tipos) for (const z of zonas) {
    out.push(`${t} en ${z.consulta}`);
    lineas.push(`${t} en ${z.consulta} #@${z.lat.toFixed(5)},${z.lon.toFixed(5)},${z.zoom}`);
  }
  return { tipos, zonas, out, lineas };
}

/* ---------- selector de zonas del catálogo oficial ---------- */
const sinGeo = (k) => String(k).replace(/\s*#@[\d.,-]+$/, "");

async function prepararZonas(refrescar) {
  S.zonas = S.zonas || [];
  if (!S.paises) {
    try { S.paises = await api("/api/v1/lugares/paises"); } catch (e) { S.paises = []; toast("No se pudo cargar el catálogo de lugares: " + e.message, true); }
  }
  const sel = $("#pais");
  const opt = (p) => `<option value="${p.cc}">${esc(p.nombre)}</option>`;
  sel.innerHTML = `<optgroup label="Principales (fuentes oficiales)">${S.paises.filter((p) => p.principal).map(opt).join("")}</optgroup>
    <optgroup label="Todos los países">${S.paises.filter((p) => !p.principal).map(opt).join("")}</optgroup>`;
  const guardado = localStorage.getItem("gmaps.pais");
  sel.value = S.pais || (S.paises.some((p) => p.cc === guardado) ? guardado : (S.paises[0] || {}).cc || "");
  // Fuentes del país elegido (su catálogo se carga en el servidor la primera vez).
  const fuentes = async () => {
    const cc = sel.value;
    $("#zonaHint").innerHTML = `<i data-lucide="loader-circle" class="spin" style="width:12px;height:12px;vertical-align:-2px"></i> Cargando el catálogo de lugares…`;
    icons();
    try {
      const p = await api(`/api/v1/lugares/paises?cc=${cc}`);
      if (sel.value !== cc) return;
      $("#zonaHint").innerHTML = `Solo se pueden elegir lugares reales del catálogo (${fmtN(p.lugares)} lugares). Fuentes: ${Object.values(p.fuentes).map(esc).join(" · ")}.`;
    } catch (e) { $("#zonaHint").textContent = "No se pudo cargar el catálogo de este país: " + e.message; }
  };
  fuentes();
  sel.onchange = () => { S.pais = sel.value; localStorage.setItem("gmaps.pais", sel.value); $("#zonaQ").value = ""; cerrarLista(); fuentes(); $("#zonaQ").focus(); };

  const inp = $("#zonaQ"), lista = $("#zonaL");
  let t = null, pedida = 0, res = [], act = -1;
  const cerrarLista = () => { lista.hidden = true; inp.setAttribute("aria-expanded", "false"); act = -1; };
  const marcar = () => lista.querySelectorAll("li[data-i]").forEach((li) => li.classList.toggle("on", +li.dataset.i === act));
  const pintar = (q) => {
    lista.hidden = false;
    inp.setAttribute("aria-expanded", "true");
    lista.innerHTML = res.length
      ? res.map((l, i) => `<li role="option" data-i="${i}"><span class="ac-t">${esc(l.etiqueta)}</span><b>${esc(l.nombre)}</b><span class="ac-c">${esc(l.contexto)}</span></li>`).join("")
      : `<li class="none">Ningún lugar del catálogo oficial coincide con «${esc(q)}». Revisa cómo se escribe o busca el municipio.</li>`;
    lista.querySelectorAll("li[data-i]").forEach((li) => (li.onmousedown = (e) => { e.preventDefault(); elegir(res[+li.dataset.i]); }));
  };
  const elegir = (l) => {
    if (!l) return;
    cerrarLista();
    inp.value = "";
    if (S.zonas.some((z) => z.pais === l.pais && z.tipo === l.tipo && z.codigo === l.codigo && z.nombre === l.nombre && z.contexto === l.contexto)) return toast("Esa zona ya está añadida");
    const z = { ...l, verif: l.pais === "ES" && l.tipo === "cp" ? "pendiente" : "" };
    S.zonas.push(z);
    pintarZonas(refrescar);
    if (z.verif) verificarCP(z, refrescar);
  };
  inp.oninput = () => {
    clearTimeout(t);
    const q = inp.value.trim();
    if (q.length < 2) return cerrarLista();
    t = setTimeout(async () => {
      const n = ++pedida;
      try {
        const r = await api(`/api/v1/lugares?pais=${encodeURIComponent(sel.value)}&q=${encodeURIComponent(q)}&limite=12`);
        if (n !== pedida) return;
        res = r; act = res.length ? 0 : -1;
        pintar(q); marcar();
      } catch (e) { toast("No se pudo buscar el lugar: " + e.message, true); }
    }, 180);
  };
  inp.onkeydown = (e) => {
    if (lista.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); act = Math.min(act + 1, res.length - 1); marcar(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); act = Math.max(act - 1, 0); marcar(); }
    else if (e.key === "Enter") { e.preventDefault(); elegir(res[act]); }
    else if (e.key === "Escape") cerrarLista();
  };
  inp.onblur = () => setTimeout(cerrarLista, 150);
  pintarZonas(refrescar);
}

function pintarZonas(refrescar) {
  $("#zonasSel").innerHTML = S.zonas.map((z, i) => `<span class="zona-chip" title="${esc(z.fuente)}${z.codigo ? " · código oficial " + esc(z.codigo) : ""}">
      <span class="ac-t">${esc(z.etiqueta)}</span><b>${esc(z.nombre)}</b><span class="ac-c">${esc(z.contexto)}</span>
      ${z.verif === "pendiente" ? `<span class="zv"><i data-lucide="loader-circle" class="spin"></i>Verificando…</span>` : z.verif === "ok" ? `<span class="zv ok" title="Código postal verificado en CartoCiudad (Instituto Geográfico Nacional)"><i data-lucide="shield-check"></i>Verificado IGN</span>` : ""}
      <button type="button" class="btn btn-icon btn-ghost" data-quitar-zona="${i}" title="Quitar zona"><i data-lucide="x"></i></button></span>`).join("");
  icons();
  document.querySelectorAll("[data-quitar-zona]").forEach((b) => (b.onclick = () => { S.zonas.splice(+b.dataset.quitarZona, 1); pintarZonas(refrescar); }));
  refrescar();
}

// Los códigos postales de España se comprueban en CartoCiudad (IGN), que además da su centroide oficial.
async function verificarCP(z, refrescar) {
  try {
    const v = await api(`/api/v1/lugares/verificar?pais=ES&cp=${encodeURIComponent(z.cp)}`);
    if (!S.zonas.includes(z)) return;
    if (v.ok) { z.verif = "ok"; z.lat = v.lat; z.lon = v.lon; }
    else if (/no responde/.test(v.motivo || "")) { z.verif = ""; toast("CartoCiudad no responde: se usa el código postal del catálogo sin verificación en línea"); }
    else { S.zonas.splice(S.zonas.indexOf(z), 1); toast(`${z.cp}: ${v.motivo}. Se ha quitado.`, true); }
  } catch (e) { z.verif = ""; }
  pintarZonas(refrescar);
}

function enlazarFormulario() {
  const f = $("#form");
  const refrescar = () => {
    const { out } = consultas();
    $("#preview").hidden = !out.length;
    $("#previewT").textContent = out.length === 1 ? "Se hará 1 búsqueda en Google Maps:" : `Se harán ${out.length} búsquedas en Google Maps:`;
    $("#previewL").innerHTML = out.slice(0, 12).map((q) => `<li>${esc(q)}</li>`).join("") + (out.length > 12 ? `<li>y ${out.length - 12} más…</li>` : "");
  };
  $("#tipos").oninput = refrescar;
  prepararZonas(refrescar);
  $("#cobertura").onchange = (e) => {
    document.querySelectorAll("#cobertura .option").forEach((o) => o.classList.toggle("sel", o.querySelector("input").checked));
    $("#maxt").value = String(COBERTURA[e.target.value].min);
  };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const { tipos, zonas, lineas } = consultas();
    if (!tipos.length) return toast("Escribe al menos un tipo de negocio", true);
    if (!zonas.length) {
      $("#zonaQ").focus();
      return toast($("#zonaQ").value.trim() ? "Elige la zona de la lista: solo se admiten lugares del catálogo oficial" : "Elige al menos una zona de la lista", true);
    }
    if (zonas.some((z) => z.verif === "pendiente")) return toast("Espera a que termine la verificación del código postal", true);
    const depth = +f.querySelector("input[name=depth]:checked").value;
    const nombre = $("#nombre").value.trim() ||
      `${tipos.length === 1 ? tipos[0][0].toUpperCase() + tipos[0].slice(1) : tipos.length + " tipos de negocio"} · ${zonas.length === 1 ? zonas[0].nombre : zonas.length + " zonas"}`;
    const body = {
      name: nombre, keywords: lineas, lang: $("#lang").value, zoom: 15, depth,
      email: $("#email").checked, max_time: +$("#maxt").value * 60,
      proxies: $("#proxies").value.split("\n").map((s) => s.trim()).filter(Boolean),
      zonas: zonas.map(({ verif, ...z }) => z),
    };
    $("#go").disabled = true;
    try {
      await api("/api/v1/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      toast("Búsqueda iniciada. Puedes seguir trabajando mientras se completa.");
      $("#tipos").value = $("#nombre").value = "";
      S.zonas = [];
      pintarZonas(refrescar);
      cargarJobs();
    } catch (err) {
      toast("No se pudo iniciar: " + err.message, true);
    } finally {
      $("#go").disabled = false;
    }
  };
}

async function leadsDe(id) {
  if (!S.leadsCache[id]) S.leadsCache[id] = await api(`/api/v1/jobs/${id}/leads`);
  return S.leadsCache[id];
}

function resumen(leads) {
  return {
    total: leads.length,
    tel: leads.filter((l) => l.phone).length,
    movil: leads.filter((l) => esMovil(l.phone)).length,
    email: leads.filter((l) => l.emails && l.emails.length).length,
    web: leads.filter((l) => l.website).length,
    sinWeb: leads.filter((l) => !l.website).length,
  };
}

async function cargarJobs() {
  clearTimeout(S.poll);
  if (S.res || !$("#jobs")) return;
  try {
    const jobs = (await api("/api/v1/jobs")) || [];
    jobs.sort((a, b) => new Date(b.Date) - new Date(a.Date));
    S.jobs = jobs;
    for (const j of jobs) if (j.Status === "ok") { try { await leadsDe(j.ID); } catch (e) {} }
    pintarJobs();
    if (jobs.some((j) => j.Status === "working" || j.Status === "pending")) S.poll = setTimeout(cargarJobs, 5000);
    else S.poll = setTimeout(cargarJobs, 30000);
  } catch (e) {
    $("#jobs").innerHTML = `<div class="empty"><div class="ico"><i data-lucide="wifi-off"></i></div><h3>No se puede conectar</h3><p>¿Está abierta la ventana del programa? Vuelve a lanzar arrancar.cmd.</p></div>`;
    icons();
    S.poll = setTimeout(cargarJobs, 8000);
  }
}

function estadoDe(j) {
  if (j.Status === "ok" && S.leadsCache[j.ID] && !S.leadsCache[j.ID].length) return "empty";
  return ESTADO[j.Status] ? j.Status : "pending";
}

function pintarJobs() {
  const el = $("#jobs");
  if (!el) return;
  $("#jobsN").textContent = S.jobs.length ? `· ${S.jobs.length}` : "";
  if (!S.jobs.length) {
    el.innerHTML = `<div class="empty"><div class="ico"><i data-lucide="map-pin"></i></div><h3>Aún no hay búsquedas</h3><p>Rellena el formulario de la izquierda: por ejemplo «restaurantes» en «Chapinero, Bogotá».</p></div>`;
    return icons();
  }
  el.innerHTML = S.jobs.map((j) => {
    const st = estadoDe(j), e = ESTADO[st];
    const kws = (j.Data.keywords || []).map(sinGeo);
    const leads = S.leadsCache[j.ID];
    const maxMin = Math.round((j.Data.max_time || 0) / 6e10);
    let meta = `<span><i data-lucide="calendar"></i>${esc(fmtDate(j.Date))}</span>`;
    let barra = "";

      meta += `<span><i data-lucide="timer"></i>${Math.max(1, Math.round(trans))} de máx. ${maxMin} min</span>`;

    }
    if (leads && leads.length) {

      meta += `<span><i data-lucide="store"></i><b>${fmtN(r.total)}</b>&nbsp;negocios</span>
               <span><i data-lucide="phone"></i>${fmtN(r.tel)} con teléfono</span>
               <span><i data-lucide="mail"></i>${fmtN(r.email)} con email</span>`;
    }
    if (st === "empty") meta += `<span>Google no devolvió negocios. Prueba con una zona más concreta.</span>`;
    const abre = st === "ok";
    return `<div class="job">
      <div>
        <div class="job-t">${esc(j.Name)}<span class="tag ${e.c}"><i data-lucide="${e.i}" class="${st === "working" ? "spin" : ""}"></i>${e.t}</span></div>

async function borrar(id) {
  const j = S.jobs.find((x) => x.ID === id) || (S.res && S.res.job);
  if (!(await confirmar("¿Eliminar esta búsqueda?", `Se borrará «${j ? j.Name : ""}» y sus resultados. No se puede deshacer.`))) return;
  try {
    await api(`/api/v1/jobs/${id}`, { method: "DELETE" });
    delete S.leadsCache[id];
    toast("Búsqueda eliminada");
    if (location.hash) location.hash = ""; else cargarJobs();
  } catch (e) { toast("No se pudo eliminar: " + e.message, true); }
}

async function repetir(id) {
  const j = S.jobs.find((x) => x.ID === id) || (S.res && S.res.job);

/* ================= exportar a Excel ================= */
function siNo(tech, l, k) {
  if (!l.website) return "Sin web";
  const t = tech[l.website];
  if (!t) return "Sin analizar";
  if (t.status === "social") return "Web = perfil de " + t.social;
  if (t.status === "thirdparty") return "Web = ficha en " + t.social;
  if (t.status !== "ok") return "No se pudo analizar";
  if (!t[k] && k === "meta_pixel" && t.unsure) return "No verificable";
  return t[k] ? "Sí" : "No";
}

function exportar(leads, nombre, tech = {}, social = {}) {
  const cols = [
    ["Nombre", (l) => l.title], ["Categoría", (l) => l.category], ["Teléfono", (l) => l.phone],
    ["Móvil (WhatsApp)", (l) => (esMovil(l.phone) ? "Sí" : "No")], ["Email", (l) => (l.emails || []).join(", ")],
    ["Web", (l) => l.website], ["Dirección", (l) => l.address], ["Barrio", (l) => l.borough], ["Ciudad", (l) => l.city],
    ["Valoración", (l) => (l.rating ? String(l.rating.toFixed(1)).replace(".", ",") : "")], ["Nº reseñas", (l) => l.reviews || ""],
    ["Rango de precios", (l) => l.price_range],
    ["Píxel de Meta", (l) => siNo(tech, l, "meta_pixel")], ["ID píxel de Meta", (l) => ((tech[l.website] || {}).meta_ids || []).join(", ")],
    ["Google Ads", (l) => siNo(tech, l, "google_ads")], ["Google Analytics", (l) => siNo(tech, l, "analytics")],
    ["TikTok Ads", (l) => siNo(tech, l, "tiktok")], ["LinkedIn Ads", (l) => siNo(tech, l, "linkedin")],
    ["Plataforma web", (l) => (tech[l.website] || {}).platform || ""],
    ["Chat / agente IA", (l) => ((tech[l.website] || {}).chats || []).map((c) => c.name).join(", ")],
    ["Tiene agente IA", (l) => (!l.website ? "Sin web" : !tech[l.website] ? "Sin analizar" : ((tech[l.website].chats || []).some((c) => c.kind === "ia") ? "Sí" : "No"))],
    ...Object.entries(REDES).map(([k, [, n]]) => [n, (l) => redesDe(l, tech)[k] || ""]),
    ...["facebook", "instagram", "tiktok", "youtube"].map((k) => ["Seguidores " + REDES[k][1], (l) => { const st = (social[redesDe(l, tech)[k]] || {}); return st.status === "ok" && st.followers ? st.followers : ""; }]), ["Ficha verificada", (l) => (l.claimed ? "Sí" : "No")], ["Google Maps", (l) => l.link],
    ...(S.res && S.res.zonas && S.res.zonas.length ? [["Dentro de la zona elegida", (l) => (enZona(l) ? "Sí" : "No")]] : []),
    ...columnasAnalitica(tech, social),
  ];
  const cel = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "﻿" + [cols.map((c) => cel(c[0])).join(";"), ...leads.map((l) => cols.map((c) => cel(c[1](l))).join(";"))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = (nombre || "negocios").replace(/[\\/:*?"<>|]/g, "-") + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${fmtN(leads.length)} negocios descargados (se abre con Excel)`);
}

/* ================= zonas elegidas ================= */
// Expresión con la «forma» de un código postal (28010 → 5 cifras; SW1A 1AA o K1A 0B1
// → letras y cifras en ese orden): sirve para cualquier país.
const formaCP = (cp) => [...plano(cp)].map((c) => (/\d/.test(c) ? "\\d" : /[a-z]/.test(c) ? "[a-z]" : /\s/.test(c) ? "\\s?" : c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))).join("");
const sinEspacios = (s) => plano(s).replace(/\s+/g, "");
const distKm = (a1, o1, a2, o2) => {
  const r = Math.PI / 180, x = Math.sin(((a2 - a1) * r) / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin(((o2 - o1) * r) / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));
};

// ¿Está el negocio en alguna de las zonas elegidas? Con coordenadas manda la geometría
// (límite oficial o radio de tolerancia); en zonas de código postal, si la dirección
// trae un código postal, además tiene que coincidir. Sin coordenadas, el nombre.
function enZona(l) {
  const zs = (S.res && S.res.zonas) || [];
  if (!zs.length) return true;
  S.res.enZona = S.res.enZona || new WeakMap();
  if (S.res.enZona.has(l)) return S.res.enZona.get(l);
  const dir = plano([l.address, l.city, l.borough].filter(Boolean).join(" "));
  const conCoord = !!(l.latitude || l.longitude);
  const ok = zs.some((z) => {
    // Códigos postales de la dirección con la misma forma que el de la zona. Los de
    // 4 cifras o menos (Argentina…) se confunden con números de portal: ahí manda la geometría.
    if (z.tipo === "cp" && !/^\d{1,4}$/.test(sinEspacios(z.cp))) {
      const cps = (dir.match(new RegExp(`(^|[^a-z0-9])(${formaCP(z.cp)})(?![a-z0-9])`, "g")) || []).map((m) => sinEspacios(m.replace(/^[^a-z0-9]/, "")));
      if (cps.length) return cps.includes(sinEspacios(z.cp));
    }
    if (!conCoord) return ` ${dir} `.includes(` ${plano(z.nombre)} `);
    const m = 0.005;
    if (z.bbox && l.latitude >= z.bbox[0] - m && l.latitude <= z.bbox[2] + m && l.longitude >= z.bbox[1] - m && l.longitude <= z.bbox[3] + m) return true;
    return distKm(l.latitude, l.longitude, z.lat, z.lon) <= z.radio_km;
  });
  S.res.enZona.set(l, ok);
  return ok;
}

  const t = S.res.tech;
  let scan = "";
  if (t.status === "running") scan = `<span class="scan"><i data-lucide="loader-circle" class="spin"></i>Analizando publicidad de las webs: ${t.done} de ${t.total}<span class="bar"><i style="width:${t.total ? (t.done / t.total) * 100 : 0}%"></i></span></span>`;
  else if (t.status === "done") scan = `<span class="scan"><i data-lucide="circle-check"></i>Webs analizadas: ${t.total}<button class="btn btn-ghost btn-sm" id="reTech" title="Volver a revisar las webs"><i data-lucide="refresh-cw"></i>Volver a analizar</button></span>${estadoRedes()}`;
  const fuera = S.res.zonas.length ? S.res.leads.filter((l) => !enZona(l)).length : 0;
  const avisoZona = fuera ? `<span class="opp" title="Google Maps también devuelve negocios cercanos. Estos quedan fuera de las zonas elegidas."><i data-lucide="map-pin-x"></i>${fmtN(fuera)} fuera de la zona elegida${S.res.f.zona ? " (ocultos)" : ""}</span>` : "";
  $("#count").innerHTML = (n === total ? `${fmtN(total)} negocios` : `Mostrando ${fmtN(n)} de ${fmtN(total)} negocios`) + avisoZona + scan;
  icons();
  const b = $("#reTech");
  if (b) b.onclick = () => cargarTech(S.res.job.ID, false, true);
  const rs = $("#goSocial");
  if (rs) rs.onclick = () => cargarSocial(S.res.job.ID, true);
  const rr = $("#retrySocial");
  if (rr) rr.onclick = () => cargarSocial(S.res.job.ID, true, true);
}

function pintarKpis() {
  const { leads } = S.res;
  const r = resumen(leads);
  const media = leads.filter((l) => l.rating).reduce((a, l, _, arr) => a + l.rating / arr.length, 0);
  const t = S.res.tech;
  const analizadas = leads.filter((l) => { const x = techDe(l); return x && x.status === "ok"; });
  const meta = analizadas.filter((l) => techDe(l).meta_pixel).length;
  const conChat = analizadas.filter((l) => (techDe(l).chats || []).some((c) => c.kind !== "whatsapp")).length;
  const conIA = analizadas.filter((l) => (techDe(l).chats || []).some((c) => c.kind === "ia")).length;
  const metaV = t.status === "idle" ? "—" : t.status === "running" && !analizadas.length ? "…" : fmtN(meta);
  const metaP = analizadas.length ? `${pct(meta, analizadas.length)} de las webs` : t.status === "running" ? "analizando…" : "";
  $("#kpis").innerHTML = [["store", "Negocios", fmtN(r.total), ""], ["phone", "Con teléfono", fmtN(r.tel), pct(r.tel, r.total)],
    [marca("whatsapp"), "Móvil (WhatsApp)", fmtN(r.movil), pct(r.movil, r.total)], ["mail", "Con email", fmtN(r.email), pct(r.email, r.total)],
    ["globe", "Sin página web", fmtN(r.sinWeb), pct(r.sinWeb, r.total)], [marca("meta"), "Con píxel de Meta", metaV, metaP],
    ["bot", "Con chat o agente IA", t.status === "idle" ? "—" : !analizadas.length ? "…" : fmtN(conChat), analizadas.length ? `${fmtN(conIA)} con agente IA` : ""],
    ["star", "Valoración media", media ? media.toFixed(1).replace(".", ",") : "—", "sobre 5"]]
    .map(([i, l, v, p]) => `<div class="kpi"><div class="l">${i.startsWith("<") ? i : `<i data-lucide="${i}"></i>`}${l}</div><div class="v">${v}</div><div class="p">${p || "&nbsp;"}</div></div>`).join("");
  icons();
}

function celdaPublicidad(l) {
  if (!l.website) return `<span class="none">—</span>`;
  const t = techDe(l);
  if (!t) return S.res.tech.status === "running" ? `<span class="none">Analizando…</span>` : `<span class="none">Sin analizar</span>`;
  if (t.status === "social") return `<span class="none">Su «web» es un perfil de ${marca(t.social)} ${esc(t.social)}</span>`;
  if (t.status === "thirdparty") return `<span class="none" title="Lo que hay en esa página es de la plataforma, no del negocio">Su «web» es su ficha en ${marca(t.social)} ${esc(t.social)}</span>`;
  if (t.status !== "ok") return `<span class="none" title="${esc(t.error || "")}">No se pudo revisar</span>`;
  const tags = [];
  if (t.meta_pixel) tags.push(`<span class="ad ad-meta" title="${esc((t.meta_ids || []).join(", "))}">${marca("meta")}Píxel de Meta</span>`);
  if (t.google_ads) tags.push(`<span class="ad">${marca("googleads")}Google Ads</span>`);
  if (t.tiktok) tags.push(`<span class="ad">${marca("tiktok")}TikTok</span>`);
  if (t.linkedin) tags.push(`<span class="ad">${marca("linkedin")}LinkedIn</span>`);
  if (t.analytics) tags.push(`<span class="ad">${marca("googleanalytics")}Analytics</span>`);
  for (const c of t.chats || []) tags.push(`<span class="ad ${c.kind === "ia" ? "ad-ia" : c.kind === "whatsapp" ? "ad-wa" : ""}" title="${esc(TIPO_CHAT[c.kind])}">${iconoChat(c)}${esc(c.name)}</span>`);
  if (!t.meta_pixel && t.unsure) tags.unshift(`<span class="ad" title="${esc(t.unsure)}">${marca("meta")}Píxel de Meta: no verificable</span>`);
  return tags.length ? `<div class="ads">${tags.join("")}</div>` : `<span class="none">Sin publicidad ni chat</span>`;
}

function seccionPublicidad(l) {
  const biblioteca = `https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=ALL&search_type=keyword_unordered&q=${encodeURIComponent(l.title)}`;
  const enlace = `<div style="margin-top:10px"><a href="${biblioteca}" target="_blank" rel="noopener">${marca("meta")} Ver si tiene anuncios activos en la Biblioteca de anuncios de Meta</a><div class="hint">Tener el píxel indica que su web está preparada para medir anuncios de Facebook e Instagram; no garantiza que esté anunciándose ahora.</div></div>`;
  if (!l.website) return `<div class="sec"><h4>Publicidad y medición</h4><p class="none" style="margin:0">No tiene web que revisar.</p>${enlace}</div>`;
  const t = techDe(l);
  let cuerpo;
  if (!t) cuerpo = `<p class="none" style="margin:0">${S.res.tech.status === "running" ? "Analizando su web…" : "Sin analizar."}</p>`;
  else if (t.status === "social") cuerpo = `<p style="margin:0">Su «web» en Google es un perfil de ${marca(t.social)} <b>${esc(t.social)}</b>: no tiene página propia.</p>`;
  else if (t.status === "thirdparty") cuerpo = `<p style="margin:0">Su «web» en Google es su ficha en ${marca(t.social)} <b>${esc(t.social)}</b>, una plataforma externa: no tiene página propia. <span class="opp"><i data-lucide="lightbulb"></i>Oportunidad</span></p>`;
  else if (t.status !== "ok") cuerpo = `<p class="none" style="margin:0">No se pudo revisar: ${esc(t.error || "error")}.</p>`;
  else {
    const si = (v, extra = "") => v === null ? "" : v ? `<b style="color:var(--ok)">Sí</b>${extra}` : `<span class="none">No</span>`;
    const fila = (ic, k, v) => `${ic.startsWith("<") ? ic : `<i data-lucide="${ic}"></i>`}<div><div class="k">${k}</div>${v}</div>`;
    cuerpo = `<div class="dl">
      ${fila(marca("meta"), "Píxel de Meta (Facebook / Instagram)", (!t.meta_pixel && t.unsure ? `<span class="none">No verificable</span><div class="none">${esc(t.unsure)}</div>` : "") + si(t.meta_pixel || !t.unsure ? t.meta_pixel : null, (t.meta_ids || []).length ? ` · ID ${t.meta_ids.map(esc).join(", ")}` : "") + (t.meta_via_gtm ? `<div class="none">Instalado a través de Google Tag Manager</div>` : ""))}
      ${fila(marca("googleads"), "Google Ads", si(t.google_ads, (t.google_ads_ids || []).length ? " · " + t.google_ads_ids.map(esc).join(", ") : ""))}
      ${fila(marca("googleanalytics"), "Google Analytics", si(t.analytics))}
      ${fila(marca("tiktok"), "TikTok Ads", si(t.tiktok))}
      ${fila(marca("linkedin"), "LinkedIn Ads", si(t.linkedin))}
      ${fila(marca(t.platform, "layout-template"), "Hecha con", t.platform ? esc(t.platform) : `<span class="none">No identificado</span>`)}
    </div>`;
  }
  return `<div class="sec"><h4>Publicidad y medición</h4>${cuerpo}${enlace}</div>`;
}

/* ================= redes sociales y chat ================= */
const TIPO_CHAT = { ia: "Agente IA / chatbot", chat: "Chat en vivo (algunos incluyen IA opcional)", whatsapp: "Botón de WhatsApp" };
const iconoChat = (c) => marca(c.name, c.kind === "ia" ? "bot" : c.kind === "whatsapp" ? "message-circle" : "messages-square");

// Redes del negocio: las enlazadas desde su web o, si su «web» es un perfil, ese perfil.
function redesDe(l, tech) {
  const t = tech ? tech[l.website] : techDe(l);
  return (t && t.socials) || {};
}

function socialDe(u) { return S.res && u ? S.res.social.results[u] : null; }

function seguidores(l) {
  return Object.values(redesDe(l)).reduce((a, u) => { const st = socialDe(u); return a + (st && st.status === "ok" ? st.followers || 0 : 0); }, 0);
}

function celdaRedes(l) {
  const r = redesDe(l);
  const ks = Object.keys(REDES).filter((k) => r[k]);
  if (!ks.length) return "";
  return `<div class="nets">${ks.map((k) => {
    const st = socialDe(r[k]);
    const n = st && st.status === "ok" && st.followers ? ` <small>${fmtK(st.followers)}</small>` : "";
    return `<a class="net" href="${esc(r[k])}" target="_blank" rel="noopener" title="${REDES[k][1]}" onclick="event.stopPropagation()">${marca(k) || REDES[k][0]}${n}</a>`;
  }).join("")}</div>`;
}

function estadoRedes() {
  const sc = S.res.social;
  const hay = S.res.leads.some((l) => ["facebook", "instagram", "tiktok", "youtube"].some((k) => redesDe(l)[k]));
  if (!hay) return "";
  if (sc.status === "running") return `<span class="scan"><i data-lucide="loader-circle" class="spin"></i>Consultando redes: ${sc.done} de ${sc.total}<span class="bar"><i style="width:${sc.total ? (sc.done / sc.total) * 100 : 0}%"></i></span></span>`;
  if (sc.status === "done") {
    const ok = Object.values(sc.results).filter((x) => x.status === "ok").length;
    const sin = sc.total - ok;
    const reintentar = sin ? `<button class="btn btn-ghost btn-sm" id="retrySocial" title="Las redes limitan cuántas consultas aceptan seguidas. Vuelve a intentarlo pasados unos minutos."><i data-lucide="rotate-ccw"></i>Reintentar las ${sin} sin datos</button>` : "";
    return `<span class="scan"><i data-lucide="share-2"></i>Redes con datos: ${ok} de ${sc.total}${reintentar}<button class="btn btn-ghost btn-sm" id="goSocial" title="Volver a consultar todas"><i data-lucide="refresh-cw"></i>Actualizar todas</button></span>`;
  }
  return `<span class="scan"><button class="btn btn-sm" id="goSocial" title="Consulta seguidores y datos públicos de Facebook, Instagram, TikTok y YouTube"><i data-lucide="users"></i>Consultar datos de sus redes sociales</button></span>`;
}

async function cargarSocial(id, arrancar = false, reintentar = false) {
  if (!S.res || S.res.job.ID !== id) return;
  try {
    let sc = await api(`/api/v1/jobs/${id}/social`);
    if (arrancar) sc = await api(`/api/v1/jobs/${id}/social${reintentar ? "?reintentar=1" : ""}`, { method: "POST" });
    if (!S.res || S.res.job.ID !== id) return;
    S.res.social = sc;
    refrescarPanel();
    if (S.res.sel != null && $("#drawer").classList.contains("open")) abrirDetalle(S.res.sel);
    if (sc.status === "running") setTimeout(() => cargarSocial(id), 2500);
  } catch (e) { toast("No se pudieron consultar las redes: " + e.message, true); }
}

function seccionChat(l) {
  if (!l.website) return "";
  const t = techDe(l);
  if (!t || t.status !== "ok") return "";
  const cs = t.chats || [];
  const cuerpo = cs.length
    ? `<div class="dl">${cs.map((c) => `${iconoChat(c)}<div><div class="k">${esc(TIPO_CHAT[c.kind])}</div>${esc(c.name)}</div>`).join("")}</div>`
    : `<p style="margin:0"><span class="opp"><i data-lucide="lightbulb"></i>Oportunidad</span> Su web no tiene chat ni agente IA: nadie atiende a quien la visita.</p>`;
  return `<div class="sec"><h4>Chat y agentes IA en su web</h4>${cuerpo}</div>`;
}

function seccionRedes(l) {
  const r = redesDe(l);
  const ks = Object.keys(REDES).filter((k) => r[k]);
  if (!ks.length) {
    const t = techDe(l);
    const txt = !l.website ? "Sin web: no se pueden buscar sus redes." : !t ? "Pendiente de analizar su web." : t.status === "thirdparty" ? `Su «web» es su ficha en ${t.social}: las redes que aparecen ahí son de la plataforma.` : t.status === "error" ? "No se pudo revisar su web." : "Su web no enlaza a ninguna red social.";
    return `<div class="sec"><h4>Redes sociales</h4><p class="none" style="margin:0">${txt}</p></div>`;
  }
  const sc = S.res.social;
  const tarjetas = ks.map((k) => {
    const u = r[k], st = socialDe(u);
    const nombre = u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
    let datos = "";
    if (st && st.status === "ok") {
      const n = [["Seguidores", st.followers], [k === "youtube" || k === "tiktok" ? "Vídeos" : "Publicaciones", st.posts], ["Me gusta", st.likes], ["Han estado aquí", st.checkins], ["Siguiendo", st.following]]
        .filter(([, v]) => v).map(([t, v]) => `<div><strong>${fmtN(v)}</strong>${t}</div>`).join("");
      datos = (n ? `<div class="soc-n">${n}</div>` : "")
        + (st.last_post ? `<p>Última publicación: ${esc(new Intl.DateTimeFormat("es", { dateStyle: "medium" }).format(new Date(st.last_post)))}</p>` : "")
        + (st.category ? `<p>Categoría: ${esc(st.category)}</p>` : "")
        + (st.bio ? `<p>${esc(st.bio.slice(0, 220))}</p>` : "");
    } else if (st) datos = `<p>${esc(st.message || "Sin datos")}</p>`;
    else if (["facebook", "instagram", "tiktok", "youtube"].includes(k)) datos = sc.status === "running" ? `<p>Consultando…</p>` : "";
    else if (k !== "whatsapp") datos = `<p>${REDES[k][1]} exige iniciar sesión: solo el enlace.</p>`;
    return `<div class="soc"><div class="soc-h"><b>${marca(k)}${REDES[k][1]}${st && st.verified ? ' <i data-lucide="badge-check" style="width:13px;height:13px;color:var(--accent)"></i>' : ""}</b>
      <a href="${esc(u)}" target="_blank" rel="noopener">${esc(nombre)}</a></div>${datos}${metricasRed(k, st)}</div>`;
  }).join("");
  const boton = sc.status === "idle" && ks.some((k) => ["facebook", "instagram", "tiktok", "youtube"].includes(k))
    ? `<button class="btn btn-sm" style="margin-top:10px" onclick="cargarSocial(S.res.job.ID, true)"><i data-lucide="users"></i>Consultar datos de las redes de esta búsqueda</button>` : "";
  return `<div class="sec"><h4>Redes sociales</h4>${tarjetas}${boton}</div>`;
}

function filtrar() {
  const { leads, f } = S.res;
  const q = plano(f.q.trim());
  let out = leads.filter((l) => {
    if (f.cat && l.category !== f.cat) return false;
    if (f.tel && !l.phone) return false;
    if (f.movil && !esMovil(l.phone)) return false;
    if (f.email && !(l.emails && l.emails.length)) return false;
    if (f.web && !l.website) return false;
    if (f.sinweb && l.website) return false;
    if (f.min && l.rating < f.min) return false;
    if (f.meta && !(techDe(l) || {}).meta_pixel) return false;
    if (f.nometa) { const t = techDe(l); if (!t || t.status !== "ok" || t.meta_pixel) return false; }
    if (f.chat && !((techDe(l) || {}).chats || []).some((c) => c.kind !== "whatsapp")) return false;
    if (f.nochat) { const t = techDe(l); if (!t || t.status !== "ok" || (t.chats || []).some((c) => c.kind !== "whatsapp")) return false; }
    if (f.redes && !Object.keys(redesDe(l)).length) return false;
    if (f.zona && !enZona(l)) return false;
    if (q && !plano([l.title, l.address, l.category, l.phone, l.website, (l.emails || []).join(" "), l.borough].join(" ")).includes(q)) return false;
    return true;
  });
  const ord = { reviews: (a, b) => b.reviews - a.reviews, rating: (a, b) => b.rating - a.rating || b.reviews - a.reviews, nombre: (a, b) => a.title.localeCompare(b.title, "es"), seguidores: (a, b) => seguidores(b) - seguidores(a) || b.reviews - a.reviews };
  return out.sort(ord[f.orden]);
}

// Repinta tras llegar datos nuevos, sin mover el mapa ni borrar un filtro a medio escribir.
function refrescarPanel() {
  const editando = document.activeElement && document.activeElement.closest(".an-filtros");
  if (S.res.tab === "lista" || (S.res.tab === "analitica" && !editando)) pintarPanel();
  else { pintarCount(filtrar().length, S.res.leads.length); pintarKpis(); }
}

function pintarPanel() {
  const lista = filtrar();
  const total = S.res.leads.length;
  pintarCount(lista.length, total);
  pintarKpis();
  if (S.res.map) { S.res.map.remove(); S.res.map = null; }
  if (S.res.tab === "analitica") return pintarAnalitica();

  if (!lista.length) {
    $("#panel").innerHTML = `<div class="empty"><div class="ico"><i data-lucide="filter-x"></i></div><h3>Ningún negocio cumple los filtros</h3><p>Quita alguno de los filtros de arriba.</p></div>`;
    return icons();
  }

  if (S.res.tab === "mapa") {
    $("#panel").innerHTML = `<div id="map"></div>`;
    if (!window.L) { $("#panel").innerHTML = `<div class="empty"><p>El mapa necesita conexión a internet.</p></div>`; return; }
    const map = L.map("map");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    const pts = [];
    lista.forEach((l) => {
      if (!l.latitude && !l.longitude) return;
      const m = L.circleMarker([l.latitude, l.longitude], { radius: 7, color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim(), weight: 2, fillOpacity: .7 }).addTo(map);
      m.bindTooltip(esc(l.title));
      m.on("click", () => abrirDetalle(S.res.leads.indexOf(l)));
      pts.push([l.latitude, l.longitude]);
    });
    if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });
    S.res.map = map;
    return;
  }

  $("#panel").innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>Negocio</th><th>Contacto</th><th>Web y redes</th><th>Publicidad y chat</th><th>Valoración</th><th>Zona</th></tr></thead>
    <tbody>${lista.map((l) => {
      const i = S.res.leads.indexOf(l);
      const movil = esMovil(l.phone);
      return `<tr data-i="${i}" class="${S.res.sel === i ? "sel" : ""}">
        <td><div class="biz">
          ${l.thumbnail ? `<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="${esc(l.thumbnail)}" alt="">` : `<div class="thumb"><i data-lucide="store"></i></div>`}
          <div><b>${esc(l.title)}</b><div class="c">${esc(l.category || "Sin categoría")}</div>
          ${l.claimed ? `<span class="ver"><i data-lucide="badge-check"></i>Ficha verificada</span>` : ""}</div>
        </div></td>
        <td><div class="contact">
          ${l.phone ? `<div><i data-lucide="phone"></i><a href="tel:${esc(digitos(l.phone))}" onclick="event.stopPropagation()">${esc(l.phone)}</a>
            ${movil ? `<a class="wa" href="${waLink(l.phone)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${marca("whatsapp")}WhatsApp</a>` : ""}</div>` : `<div class="none"><i data-lucide="phone-off"></i>Sin teléfono</div>`}
          ${(l.emails || []).length ? l.emails.map((m) => `<div><i data-lucide="mail"></i><a href="mailto:${esc(m)}" onclick="event.stopPropagation()">${esc(m)}</a></div>`).join("") : `<div class="none"><i data-lucide="mail-x"></i>Sin email</div>`}
        </div></td>
        <td>${l.website ? `<a href="${esc(l.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(dominio(l.website))}</a>${(techDe(l) || {}).platform ? `<span class="plat">${marca(techDe(l).platform)}${esc(techDe(l).platform)}</span>` : ""}` : `<span class="opp"><i data-lucide="lightbulb"></i>Sin web</span>`}${celdaRedes(l)}</td>
        <td>${celdaPublicidad(l)}</td>
        <td>${l.rating ? `<span class="stars"><i data-lucide="star"></i>${l.rating.toFixed(1).replace(".", ",")} <small>(${fmtN(l.reviews)})</small></span>` : `<span class="none">Sin reseñas</span>`}</td>
        <td>${esc(l.borough || l.city || "")}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
  icons();
  document.querySelectorAll("#panel tbody tr").forEach((tr) => (tr.onclick = () => abrirDetalle(+tr.dataset.i)));
}

/* ================= detalle ================= */
const DIAS = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];

function abrirDetalle(i) {
  const l = S.res.leads[i];
  S.res.sel = i;
  document.querySelectorAll("#panel tbody tr").forEach((tr) => tr.classList.toggle("sel", +tr.dataset.i === i));
  const hoy = DIAS[(new Date().getDay() + 6) % 7];
  const horas = l.hours && Object.keys(l.hours).length
    ? `<table class="hours">${DIAS.map((d) => `<tr class="${d === hoy ? "today" : ""}"><td style="text-transform:capitalize">${d}</td><td>${esc((l.hours[d] || ["Cerrado"]).join(", "))}</td></tr>`).join("")}</table>`
    : `<p class="none" style="margin:0">Google no muestra horario.</p>`;
  const enlaces = [...(l.reservations || []).map((x) => ["calendar-check", "Reservar en " + x.source, x.link, x.source]),
                   ...(l.order_online || []).map((x) => ["shopping-bag", "Pedir en " + x.source, x.link, x.source]),
                   ...(l.menu ? [["book-open", "Ver carta", l.menu]] : [])];
  const fila = (ic, k, v) => `<i data-lucide="${ic}"></i><div><div class="k">${k}</div>${v}</div>`;
  const movil = esMovil(l.phone);

  $("#drawer").innerHTML = `
    <div class="drawer-h">
      <div style="flex:1"><h3>${esc(l.title)}</h3><div class="c">${esc(l.category || "")}${l.price_range ? " · " + esc(l.price_range) : ""}</div></div>
      <button class="btn btn-icon btn-ghost" id="dClose" title="Cerrar"><i data-lucide="x"></i></button>
    </div>
    <div class="drawer-b">
      ${l.thumbnail ? `<img class="photo" referrerpolicy="no-referrer" src="${esc(l.thumbnail)}" alt="">` : ""}
      <div class="dl">
        ${fila("phone", "Teléfono", l.phone ? `<a href="tel:${esc(digitos(l.phone))}">${esc(l.phone)}</a> ${movil ? `<a class="wa" href="${waLink(l.phone)}" target="_blank" rel="noopener">${marca("whatsapp")}WhatsApp</a>` : ""}` : `<span class="none">No disponible</span>`)}
        ${fila("mail", "Email", (l.emails || []).length ? l.emails.map((m) => `<a href="mailto:${esc(m)}">${esc(m)}</a>`).join("<br>") : `<span class="none">No encontrado en su web</span>`)}
        ${fila("globe", "Página web", l.website ? `<a href="${esc(l.website)}" target="_blank" rel="noopener">${esc(dominio(l.website))}</a>` : `<span class="opp"><i data-lucide="lightbulb"></i>No tiene: oportunidad de venta</span>`)}
        ${fila("map-pin", "Dirección", esc(l.address || "—") + (l.borough ? `<div class="none">${esc(l.borough)}</div>` : ""))}
        ${fila("star", "Valoración", l.rating ? `${l.rating.toFixed(1).replace(".", ",")} de 5 · ${fmtN(l.reviews)} reseñas` : `<span class="none">Sin reseñas</span>`)}
        ${fila("badge-check", "Ficha de Google", l.claimed ? "Verificada por el propietario" : `<span class="none">Sin reclamar por el propietario</span>`)}
      </div>
      ${l.description ? `<div class="sec"><h4>Descripción</h4><p style="margin:0">${esc(l.description)}</p></div>` : ""}
      ${seccionPresencia(l)}
      ${seccionChat(l)}
      ${seccionRedes(l)}
      ${seccionPublicidad(l)}
      ${seccionWeb(l)}
      <div class="sec"><h4>Horario</h4>${horas}</div>
      ${enlaces.length ? `<div class="sec"><h4>Enlaces</h4><div class="dl">${enlaces.map(([ic, t, u, src]) => `${marca(src, ic)}<div><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></div>`).join("")}</div></div>` : ""}
    </div>
    <div class="drawer-f">
      <a class="btn btn-primary" href="${esc(l.link)}" target="_blank" rel="noopener" style="flex:1">${marca("googlemaps")}Abrir en Google Maps</a>
      <button class="btn" id="dCopy"><i data-lucide="copy"></i>Copiar datos</button>
    </div>`;
  $("#drawer").classList.add("open");
  $("#drawerBg").classList.add("open");
  icons();
  $("#dClose").onclick = cerrarDetalle;
  $("#dCopy").onclick = async () => {
    const txt = [l.title, l.category, l.phone && "Tel: " + l.phone, (l.emails || []).length && "Email: " + l.emails.join(", "),
                 l.website && "Web: " + l.website, l.address && "Dirección: " + l.address].filter(Boolean).join("\n");
    try { await navigator.clipboard.writeText(txt); toast("Datos copiados"); } catch (e) { toast("No se pudo copiar", true); }
  };
}

function cerrarDetalle() {
  $("#drawer").classList.remove("open");
  $("#drawerBg").classList.remove("open");
}
$("#drawerBg").onclick = cerrarDetalle;
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("#modal").classList.contains("open")) $("#modalNo").click(); else cerrarDetalle();
});

enrutar();
</script>
</body>
</html>
